# Docker topology shared by manual tests and the automated e2e suite.

x-audit-labels: &audit-labels
  com.pg-status.audit.run: "${PG_STATUS_AUDIT_RUN_ID:-manual}"

x-security-monitor: &security-monitor
  labels: *audit-labels
  profiles:
    - security
  image: "${PG_STATUS_E2E_IMAGE:-pg-status-e2e:release}"
  platform: "${PG_STATUS_E2E_PLATFORM:-}"
  ports:
    - "127.0.0.1:0:8000"
  networks:
    - net
  security_opt:
    - seccomp=unconfined
  volumes:
    - security-certs:/tls:ro
  depends_on:
    postgres-security:
      condition: service_healthy

x-security-environment: &security-environment
  PG_STATUS_E2E_MODE: "${PG_STATUS_E2E_MODE:-release}"
  ASAN_OPTIONS: "abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1"
  UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
  TSAN_OPTIONS: "halt_on_error=1"
  pg_status__hosts: postgres-security
  pg_status__pg_database: postgres
  pg_status__pg_password: "space 'quote' \\backslash password"
  pg_status__pg_user: password_monitor
  pg_status__pg_port: "5432"
  pg_status__sleep_ms: "200"
  pg_status__max_fails: "1"
  pg_status__query_timeout_ms: "1000"
  pg_status__conn_max_age_ms: "${PG_STATUS_E2E_CONN_MAX_AGE_MS:-3000}"
  pg_status__sync_max_lag_ms: "500"
  pg_status__sync_max_lag_bytes: "1048576"

services:
  pg-status:
    labels: *audit-labels
    profiles:
      - pg-status
    image: "${PG_STATUS_E2E_IMAGE:-pg-status-e2e:release}"
    platform: "${PG_STATUS_E2E_PLATFORM:-}"
    build:
      labels: *audit-labels
      context: ../..
      dockerfile: test/e2e/Dockerfile
      args:
        PG_STATUS_E2E_BUILD_TYPE: "${PG_STATUS_E2E_BUILD_TYPE:-Release}"
        PG_STATUS_E2E_SANITIZER: "${PG_STATUS_E2E_SANITIZER:-none}"
    ports:
      - "127.0.0.1:${PG_STATUS_E2E_HTTP_PORT:-0}:8000"
    networks:
      - net
    security_opt:
      - seccomp=unconfined
    environment:
      PG_STATUS_E2E_MODE: "${PG_STATUS_E2E_MODE:-release}"
      ASAN_OPTIONS: "abort_on_error=1:strict_string_checks=1:detect_stack_use_after_return=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
      TSAN_OPTIONS: "halt_on_error=1"
      pg_status__hosts: "pg-proxy-1,pg-proxy-2,pg-proxy-3"
      pg_status__hosts_dc: "e2e-dc,e2e-dc,e2e-dc"
      pg_status__hosts_geo: "e2e-geo,e2e-geo,e2e-geo"
      PG_STATUS_E2E_CURRENT_DC: "e2e-dc"
      pg_status__current_dc_env: PG_STATUS_E2E_CURRENT_DC
      pg_status__current_geo: "e2e-geo"
      pg_status__pg_database: postgres
      pg_status__pg_password: postgres
      pg_status__pg_user: postgres
      pg_status__pg_port: "5432"
      pg_status__sleep_ms: "200"
      pg_status__max_fails: "2"
      pg_status__query_timeout_ms: "1000"
      pg_status__conn_max_age_ms: "${PG_STATUS_E2E_CONN_MAX_AGE_MS:-3000}"
      pg_status__sync_max_lag_ms: "500"
      pg_status__sync_max_lag_bytes: "1048576"
    depends_on:
      pg-proxy-1:
        condition: service_healthy
      pg-proxy-2:
        condition: service_healthy
      pg-proxy-3:
        condition: service_healthy

  postgres-primary:
    image: "${PG_STATUS_E2E_INFRA_PREFIX:-pg-status-demo}-postgres-primary"
    labels: *audit-labels
    build:
      labels: *audit-labels
      context: ./master
      args:
        POSTGRES_VERSION: "${PG_STATUS_POSTGRES_VERSION:-18}"
    networks:
      - net
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      REPLICATION_ROLE: master
    volumes:
      - primary-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U postgres -d postgres &&
          test "$(psql -U postgres -d postgres -Atc 'select pg_is_in_recovery()')" = f
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-replica-1:
    image: "${PG_STATUS_E2E_INFRA_PREFIX:-pg-status-demo}-postgres-replica-1"
    labels: *audit-labels
    build:
      labels: *audit-labels
      context: ./replica
      args:
        POSTGRES_VERSION: "${PG_STATUS_POSTGRES_VERSION:-18}"
    networks:
      - net
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      REPLICATION_ROLE: replica
      MASTER_HOST: postgres-primary
      MASTER_USER: replicator
      MASTER_PASSWORD: postgres
    volumes:
      - replica-1-data:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U postgres -d postgres &&
          test "$(psql -U postgres -d postgres -Atc 'select pg_is_in_recovery()')" = t
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-replica-2:
    image: "${PG_STATUS_E2E_INFRA_PREFIX:-pg-status-demo}-postgres-replica-2"
    labels: *audit-labels
    build:
      labels: *audit-labels
      context: ./replica
      args:
        POSTGRES_VERSION: "${PG_STATUS_POSTGRES_VERSION:-18}"
    networks:
      - net
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
      REPLICATION_ROLE: replica
      MASTER_HOST: postgres-primary
      MASTER_USER: replicator
      MASTER_PASSWORD: postgres
    volumes:
      - replica-2-data:/var/lib/postgresql/data
    depends_on:
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U postgres -d postgres &&
          test "$(psql -U postgres -d postgres -Atc 'select pg_is_in_recovery()')" = t
      interval: 2s
      timeout: 3s
      retries: 30

  postgres-security:
    image: "${PG_STATUS_E2E_INFRA_PREFIX:-pg-status-demo}-postgres-security"
    labels: *audit-labels
    profiles:
      - security
    build:
      labels: *audit-labels
      context: ./security
      args:
        POSTGRES_VERSION: "${PG_STATUS_POSTGRES_VERSION:-18}"
    networks:
      net:
        aliases:
          - postgres-wrong-name
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - security-data:/var/lib/postgresql/data
      - security-certs:/tls:ro
    depends_on:
      security-certs:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          pg_isready -U postgres -d postgres &&
          test "$(psql -U postgres -d postgres -Atc 'select 1')" = 1
      interval: 2s
      timeout: 3s
      retries: 30

  security-certs:
    image: "${PG_STATUS_E2E_INFRA_PREFIX:-pg-status-demo}-security-certs"
    labels: *audit-labels
    profiles:
      - security
    build:
      labels: *audit-labels
      context: ./security
      args:
        POSTGRES_VERSION: "${PG_STATUS_POSTGRES_VERSION:-18}"
      target: cert-generator
    volumes:
      - security-certs:/tls

  pg-status-security-disable:
    labels: *audit-labels
    <<: *security-monitor
    environment:
      <<: *security-environment
      PGSSLMODE: disable

  pg-status-security-require:
    labels: *audit-labels
    <<: *security-monitor
    environment:
      <<: *security-environment
      PGSSLMODE: require

  pg-status-security-verify-full:
    labels: *audit-labels
    <<: *security-monitor
    environment:
      <<: *security-environment
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /tls/ca.crt

  pg-status-security-wrong-host:
    labels: *audit-labels
    <<: *security-monitor
    environment:
      <<: *security-environment
      pg_status__hosts: postgres-wrong-name
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /tls/ca.crt

  pg-status-security-unknown-ca:
    labels: *audit-labels
    <<: *security-monitor
    environment:
      <<: *security-environment
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /tls/unknown-ca.crt

  pg-status-security-mtls:
    labels: *audit-labels
    <<: *security-monitor
    environment:
      <<: *security-environment
      pg_status__pg_user: mtls_monitor
      PGSSLMODE: verify-full
      PGSSLROOTCERT: /tls/ca.crt
      PGSSLCERT: /tls/client.crt
      PGSSLKEY: /tls/client.key

  pg-status-security-bad-password:
    labels: *audit-labels
    <<: *security-monitor
    environment:
      <<: *security-environment
      pg_status__pg_password: "PG_STATUS_E2E_SECRET_MARKER_'_\\_Unicode_µ"
      PGSSLMODE: require

  pg-status-security-restricted:
    labels: *audit-labels
    <<: *security-monitor
    environment:
      <<: *security-environment
      pg_status__hosts: postgres-replica-1
      pg_status__pg_user: fallback_monitor
      pg_status__pg_password: fallback
      PGSSLMODE: disable

  pg-proxy-1:
    image: "${PG_STATUS_E2E_INFRA_PREFIX:-pg-status-demo}-pg-proxy-1"
    labels: *audit-labels
    build:
      labels: *audit-labels
      context: ./haproxy-master
    networks:
      - net
    ports:
      - "127.0.0.1:${PG_STATUS_E2E_PROXY_1_PORT:-0}:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica-1:
        condition: service_healthy
      postgres-replica-2:
        condition: service_healthy
    healthcheck: &proxy-healthcheck
      test:
        - CMD
        - bash
        - -c
        - "echo 'show info' | socat stdio /tmp/haproxy.sock"
      interval: 2s
      timeout: 3s
      retries: 15

  pg-proxy-2:
    image: "${PG_STATUS_E2E_INFRA_PREFIX:-pg-status-demo}-pg-proxy-2"
    labels: *audit-labels
    build:
      labels: *audit-labels
      context: ./haproxy-replica
    networks:
      - net
    ports:
      - "127.0.0.1:${PG_STATUS_E2E_PROXY_2_PORT:-0}:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica-1:
        condition: service_healthy
      postgres-replica-2:
        condition: service_healthy
    healthcheck: *proxy-healthcheck

  pg-proxy-3:
    image: "${PG_STATUS_E2E_INFRA_PREFIX:-pg-status-demo}-pg-proxy-3"
    labels: *audit-labels
    build:
      labels: *audit-labels
      context: ./haproxy-replica-2
    networks:
      - net
    ports:
      - "127.0.0.1:${PG_STATUS_E2E_PROXY_3_PORT:-0}:5432"
    depends_on:
      postgres-primary:
        condition: service_healthy
      postgres-replica-1:
        condition: service_healthy
      postgres-replica-2:
        condition: service_healthy
    healthcheck: *proxy-healthcheck

networks:
  net:
    labels: *audit-labels

volumes:
  primary-data:
    labels: *audit-labels
  replica-1-data:
    labels: *audit-labels
  replica-2-data:
    labels: *audit-labels
  security-data:
    labels: *audit-labels
  security-certs:
    labels: *audit-labels
