# Initially routes PostgreSQL traffic to the second replica.

global
log stdout format raw daemon
maxconn 100
stats socket /run/haproxy/admin.sock mode 600 level admin expose-fd listeners
stats timeout 30s

defaults
log global
mode tcp
option dontlognull
timeout connect 5s
timeout client 1m
timeout server 1m

listen stats
bind *:8404
mode http
stats enable
stats uri /
stats refresh 5s

frontend pgsql
bind *:5432
default_backend pg_backends

backend pg_backends
mode tcp
balance first
option tcp-check
tcp-check connect

server primary postgres-primary:5432 check inter 1s rise 1 fall 1 disabled
server replica_1 postgres-replica-1:5432 check inter 1s rise 1 fall 1 disabled
server replica_2 postgres-replica-2:5432 check inter 1s rise 1 fall 1
